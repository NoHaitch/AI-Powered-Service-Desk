name: service-desk

x-backend: &backend
  image: service-desk-backend:local
  build: ./backend
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-postgres-env: &postgres-env
  DESK_DB_HOST: postgres
  DESK_DB_NAME: service_desk

services:
  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "127.0.0.1:${DESK_HTTPS_PORT:-8443}:8443"
    networks: [edge]
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    secrets: [local_tls_cert, local_tls_key]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, --no-check-certificate, --spider, https://127.0.0.1:8443/]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    <<: *backend
    environment:
      <<: *postgres-env
      DESK_REDIS_HOST: redis
      DESK_SWAGGER_ENABLED: "${DESK_SWAGGER_ENABLED:-false}"
    secrets:
      - source: desk_runtime_password
        target: DESK_DB_PASSWORD
      - source: desk_redis_password
        target: DESK_REDIS_PASSWORD
    volumes:
      - attachment_data:/var/lib/service-desk/attachments
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 4s
      retries: 5

  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: service_desk
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_admin_password, desk_runtime_password, desk_migration_password]
    networks: [data]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/10-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./infrastructure/postgres/20-audit-maintenance.sql:/docker-entrypoint-initdb.d/20-audit-maintenance.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, service_desk]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.0-alpine
    command: [redis-server, --aclfile, /run/secrets/redis_acl, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    secrets: [redis_acl, desk_redis_password]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /run/secrets/desk_redis_password)" redis-cli --user desk ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/data]

  migrate:
    <<: *backend
    profiles: [tools]
    command: [alembic, upgrade, head]
    environment:
      <<: *postgres-env
    secrets:
      - source: desk_migration_password
        target: DESK_DB_PASSWORD
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  attachment_data:

secrets:
  postgres_admin_password:
    file: ./.local/postgres_admin_password
  desk_runtime_password:
    file: ./.local/desk_runtime_password
  desk_migration_password:
    file: ./.local/desk_migration_password
  desk_redis_password:
    file: ./.local/desk_redis_password
  redis_acl:
    file: ./.local/redis_acl
  local_tls_cert:
    file: ./.local/local-tls.crt
  local_tls_key:
    file: ./.local/local-tls.key
