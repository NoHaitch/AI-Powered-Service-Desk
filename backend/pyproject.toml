[project]
name = "service-desk-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.135,<1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3,<4",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "redis>=7,<9",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.19,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "migrations"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
