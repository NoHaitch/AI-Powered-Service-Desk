server {
    listen 8443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate /run/secrets/local_tls_cert;
    ssl_certificate_key /run/secrets/local_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log off;
    error_log /dev/stderr crit;
    add_header X-Content-Type-Options nosniff always;
    root /usr/share/nginx/html;

    location ~ ^/api(?:/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://backend:8000;
        proxy_pass $api$request_uri;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 503 '{"code":"unavailable","message":"The API is unavailable.","request_id":"$request_id"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
