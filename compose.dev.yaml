services:
  frontend:
    build:
      target: development
    environment:
      DESK_BACKEND_ORIGIN: http://backend:8000
      DESK_TLS_CERT_FILE: /run/secrets/local_tls_cert
      DESK_TLS_KEY_FILE: /run/secrets/local_tls_key
    read_only: false
    volumes: !override
      - ./frontend/src:/app/src:ro
    healthcheck:
      test: [CMD, bun, -e, "const r = await fetch('https://127.0.0.1:8443/', {tls:{rejectUnauthorized:false}}); if (!r.ok) process.exit(1)"]

  backend:
    environment:
      DESK_SWAGGER_ENABLED: "${DESK_SWAGGER_ENABLED:-true}"
